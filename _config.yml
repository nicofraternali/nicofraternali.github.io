# Site
title: Nicolás Fraternali
author: Nicolás Fraternali
email: # optional
lang: en
description: >
  Notes on aerospace, engineering, math and the things I build along the way.
url: "https://nicofraternali.github.io"
baseurl: ""
permalink: /:title/
timezone: America/Argentina/Buenos_Aires

# Theme (temporary until the custom design lands)
remote_theme: riggraz/no-style-please@2f8dba2c23633b21e45dce0fe2e34ec2d79bb1ca
theme_config:
  appearance: "dark"
  back_home_text: ".."
  date_format: "%Y-%m-%d"
  show_description: false
  lowercase_titles: true

plugins:
  - jekyll-remote-theme
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap
  - jektex

# Math: rendered at build time by jektex (KaTeX), no client-side JS.
# Use $$...$$ inline and $$...$$ on its own paragraph for display math.
jektex:
  cache_dir: ".jektex-cache"
  ignore: ["*.xml"]
  silent: false
  macros:
    - ['\Q', '\mathbb{Q}']
    - ['\C', '\mathbb{C}']

markdown: kramdown
kramdown:
  input: GFM
  math_engine: mathjax  # kramdown emits \( \) and \[ \], jektex renders them

sass:
  style: compressed

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
  - .jektex-cache
  - .github
